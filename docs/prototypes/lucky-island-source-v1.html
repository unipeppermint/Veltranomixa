<style>
#lucky-island{--li-orange:#ff783e;--li-ink:#174d5b;--li-paper:#fff9ee;font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--li-ink);max-width:410px;margin:12px auto}#lucky-island *{box-sizing:border-box}#lucky-island button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}#lucky-island button:disabled{cursor:default;opacity:.6}#lucky-island .phone{position:relative;overflow:hidden;border-radius:34px;background:#d8f4f4;box-shadow:0 18px 60px #164d5b25;border:6px solid #fffaf2;min-height:750px}#lucky-island .status{display:flex;justify-content:space-between;padding:14px 23px 2px;font-size:12px;font-weight:650}#lucky-island .screen{padding:12px 21px 20px;min-height:700px;background:linear-gradient(#d8f4f4,#85d9db 65%,#dcf4e9)}#lucky-island h1,#lucky-island h2,#lucky-island p{margin:0}#lucky-island h1{font-size:37px;letter-spacing:-2px;font-weight:900}#lucky-island h2{font-size:23px;font-weight:800}#lucky-island .sub{font-size:12px;color:#49747a;margin-top:6px}#lucky-island .brand{text-align:center;padding-top:15px}#lucky-island .eyebrow{font-size:10px;letter-spacing:3px;color:#43838a;font-weight:700}#lucky-island .primary{background:linear-gradient(#ff9553,var(--li-orange));color:#fff;border:1px solid #ee7337;box-shadow:0 4px 0 #d95b2b, inset 0 2px 0 #ffffff65;border-radius:18px;padding:15px 18px;width:100%;font-size:18px;font-weight:750}#lucky-island .secondary{background:var(--li-paper);border:1px solid #decdb9;border-radius:14px;padding:11px 17px;box-shadow:0 3px 0 #bdab9330}#lucky-island .plain{background:none;border:0;padding:12px;font-size:12px}#lucky-island .island{position:relative;height:315px;margin:0 -10px;isolation:isolate}#lucky-island .land{position:absolute;left:8%;right:8%;top:112px;height:158px;background:#a8cb86;border:15px solid #f5dfaa;border-radius:51% 44% 49% 48%;transform:rotate(-9deg);box-shadow:0 13px 0 #65c2c8,0 19px 0 #ffffff66,0 27px 0 #ffffff22}#lucky-island .path{position:absolute;width:130px;height:30px;left:105px;top:204px;background:#f3dfa9;transform:rotate(-29deg);border-radius:50%}#lucky-island .house{position:absolute;top:134px;left:70px;width:91px;height:80px;background:linear-gradient(90deg,#fff5d5 70%,#e5cca0 70%);border-radius:5px;box-shadow:8px 10px 0 #4a78452a}#lucky-island .roof{position:absolute;left:-12px;top:-34px;width:104px;height:49px;background:repeating-linear-gradient(90deg,transparent 0 13px,#c45d3633 14px 16px),#f58758;clip-path:polygon(18% 0,85% 0,100% 100%,0 100%);border-radius:6px}#lucky-island .door{position:absolute;bottom:0;left:32px;width:23px;height:38px;background:#659b9b;border-radius:12px 12px 0 0;border:4px solid #f7dfaa}#lucky-island .window{position:absolute;top:23px;left:10px;width:16px;height:19px;background:#99ced0;border:3px solid #fffdf3}#lucky-island .tower{position:absolute;top:64px;right:70px;width:43px;height:132px;background:repeating-linear-gradient(0deg,#fff5db 0 35px,#f29264 35px 48px);clip-path:polygon(20% 0,80% 0,100% 100%,0 100%);filter:drop-shadow(4px 5px 0 #39604a44)}#lucky-island .cap{position:absolute;right:69px;top:45px;width:46px;height:29px;background:#f38052;border-radius:50% 50% 4px 4px;border-bottom:8px solid #3c7e86}#lucky-island .tree{position:absolute;width:49px;height:67px;border-radius:50%;background:#4e9874;box-shadow:inset 12px 4px #6eaf7e,8px 8px #2b756634}#lucky-island .tree:after{content:'';position:absolute;width:8px;height:32px;background:#927751;bottom:-19px;left:23px;border-radius:3px}#lucky-island .t1{left:37px;top:93px;transform:scale(.85)}#lucky-island .t2{right:22px;top:134px;transform:scale(.75)}#lucky-island .t3{right:113px;top:110px;transform:scale(.55)}#lucky-island .dock{position:absolute;top:236px;left:95px;width:38px;height:62px;transform:rotate(15deg);background:repeating-linear-gradient(0deg,#ba8d60 0 10px,#976e45 11px 13px);border-left:4px solid #efd1a1;border-right:4px solid #efd1a1;border-radius:3px}#lucky-island .cloud{position:absolute;top:31px;left:26px;font-size:39px;opacity:.8}#lucky-island .bird{position:absolute;right:26px;top:20px;font-size:28px;color:#fff;transform:rotate(-10deg)}#lucky-island .pill{text-align:center;background:#fff9eeda;border:1px solid #ffffff9c;border-radius:30px;padding:7px 16px;width:max-content;max-width:100%;margin:0 auto;font-size:12px;font-weight:650}#lucky-island .mission{background:var(--li-paper);border-radius:23px;padding:19px;margin-top:18px;box-shadow:0 7px 14px #21586512}#lucky-island .mission .primary{margin-top:16px}#lucky-island .nav{display:flex;justify-content:space-around;background:var(--li-paper);margin:20px -21px -20px;padding:8px 10px 12px}#lucky-island .nav button{border:0;background:none;display:grid;gap:2px;justify-items:center;font-size:11px;min-width:66px;padding:8px;color:#7d8d8e}#lucky-island .nav button:first-child{color:#128d98}#lucky-island .nav i{font-style:normal;font-size:21px}#lucky-island .topbar{display:flex;justify-content:space-between;align-items:center;margin:7px 0 23px}#lucky-island .round{width:42px;height:42px;border:0;border-radius:50%;background:var(--li-paper);font-size:23px;box-shadow:0 3px 0 #2c7f8620}#lucky-island .goal{background:var(--li-paper);padding:18px;border-radius:20px}#lucky-island .goalhead{display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:750}#lucky-island .track{height:9px;background:#e3ded0;border-radius:8px;margin-top:12px;overflow:hidden}#lucky-island .fill{height:100%;background:#319f94;border-radius:8px;transition:width .3s}#lucky-island .stats{display:flex;gap:10px;margin:12px 0}#lucky-island .stats div{flex:1;background:#fff9eeda;border-radius:14px;padding:11px;text-align:center;font-size:13px}#lucky-island .wheelbox{container-type:inline-size;position:relative;max-width:322px;width:100%;margin:23px auto 18px;aspect-ratio:1}#lucky-island .wheel{width:100%;height:100%;border:10px solid #ebc287;border-radius:50%;box-shadow:0 7px 0 #a77848,0 12px 24px #13525b30,inset 0 0 0 3px #fff1cf;position:relative;background:conic-gradient(from -22.5deg,#62b8b0 0 45deg,#ffb567 45deg 90deg,#68bdb3 90deg 135deg,#b7d9e5 135deg 180deg,#5fb0a7 180deg 225deg,#ffd291 225deg 270deg,#f69661 270deg 315deg,#ffe1ac 315deg 360deg);transition:transform 2.8s cubic-bezier(.12,.65,.13,1)}#lucky-island .wlabel{position:absolute;left:50%;top:50%;width:52px;height:58px;margin:-29px -26px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-shadow:0 2px 0 #ffffff55;font-size:28px}#lucky-island .wlabel small{font-size:13px;font-weight:800}#lucky-island .hub{position:absolute;left:38%;top:38%;width:24%;height:24%;border-radius:50%;background:linear-gradient(#fff1ca,#edbc77);border:5px solid #ffe2ac;display:grid;place-items:center;font-size:35px;color:#c58936;box-shadow:0 3px 5px #8c603733}#lucky-island .pointer{position:absolute;z-index:2;left:calc(50% - 16px);top:-10px;width:32px;height:41px;background:#ff844e;clip-path:polygon(0 0,100% 0,50% 100%);filter:drop-shadow(0 3px 0 #a95531)}#lucky-island .message{text-align:center;min-height:28px;font-size:13px;font-weight:650;margin:12px 0}#lucky-island .bottomactions{text-align:center}#lucky-island .bottomactions .secondary{margin-top:14px}#lucky-island .veil{position:absolute;inset:0;background:#123b4c88;z-index:5;display:flex;align-items:flex-end}#lucky-island .sheet{background:var(--li-paper);width:100%;padding:24px 22px 30px;border-radius:29px 29px 0 0;box-shadow:0 -8px 35px #14394022}#lucky-island .handle{width:42px;height:5px;background:#d1cbbd;border-radius:6px;margin:0 auto 21px}#lucky-island .sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}#lucky-island .choices{display:grid;gap:12px;margin:23px 0}#lucky-island .choice{display:flex;align-items:center;text-align:left;gap:13px;background:#fffdf7;border:2px solid #e8dfd1;border-radius:18px;padding:17px 12px;min-height:94px}#lucky-island .choice[aria-pressed=true]{border-color:#149ca4;background:#f1fbf6}#lucky-island .choice span{font-size:32px}#lucky-island .choice strong{font-size:17px;display:block}#lucky-island .choice small{font-size:12px;display:block;margin-top:4px;color:#60757a}#lucky-island .sheet p{margin:10px 0;font-size:14px;line-height:1.8}#lucky-island .sheet .foot{text-align:center;font-size:12px;color:#7d8989;margin-top:15px}#lucky-island .resulticon{text-align:center;font-size:62px;margin:15px}#lucky-island .collection{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:25px 0}#lucky-island .collectitem{text-align:center;padding:24px 8px;background:#fffdf5;border-radius:16px}#lucky-island .collectitem span{display:block;font-size:35px}#lucky-island label{display:flex;justify-content:space-between;padding:17px 0;border-bottom:1px solid #e6ddcf}#lucky-island input{accent-color:#129ca4;width:20px;height:20px}#lucky-island [hidden]{display:none!important}@media(prefers-reduced-motion:reduce){#lucky-island .wheel{transition-duration:.01s}}@media(max-width:360px){#lucky-island .screen{padding-left:14px;padding-right:14px}#lucky-island h1{font-size:32px}#lucky-island .wlabel{font-size:24px}}
</style>
<div class="phone"><div class="status"><span>9:41</span><span>●●● ▰</span></div><div class="screen" id="li-screen"></div><div id="li-overlay" hidden></div></div>
<script>
(()=>{const root=document.getElementById('lucky-island'),screen=root.querySelector('#li-screen'),overlay=root.querySelector('#li-overlay');const design={accent:'#ff783e',fast:false};let s={wood:0,coins:0,left:12,boost:0,double:false,spins:0,busy:false,won:false,angle:0},completed=false,pendingUpgrade=false,selection=0,lastFocus=null;const types=['wood','coin','wood','weather','wood','coin','chest','coin'];const icons={wood:'🪵',coin:'🪙',weather:'☁️',chest:'🎁'};const values=[2,2,1,1,1,1,1,3];const island=`<div class="island" role="img" aria-label="海边小岛上的小屋、树木、码头和灯塔"><div class="cloud">☁</div><div class="bird">⌁</div><div class="land"></div><div class="path"></div><div class="tree t1"></div><div class="tree t3"></div><div class="tower"></div><div class="cap"></div><div class="house"><div class="roof"></div><div class="window"></div><div class="door"></div></div><div class="tree t2"></div><div class="dock"></div></div>`;
function home(){screen.innerHTML=`<div class="brand"><div class="eyebrow">A LITTLE LUCK, EVERY DAY</div><h1>幸运小岛</h1><p class="sub">把每一次幸运，变成小岛的风景。</p></div>${island}<div class="pill">⌖ 海风港湾 · ${completed?'4':'3'}/5</div><div class="mission"><div class="eyebrow">YOUR NEXT ADVENTURE</div><h2>${completed?'灯塔已经亮起':'下一站：点亮灯塔'}</h2><p class="sub">${completed?'再挑战一次，试试不同的转盘组合。':'收集 20 个木材，修复海边灯塔。'}</p><button class="primary" data-action="start">${s.spins&&!s.won&&s.left?'继续挑战':'开始挑战'} →</button></div><nav class="nav" aria-label="主要导航"><button data-action="home"><i>⌂</i>小岛</button><button data-action="collection"><i>☆</i>收藏</button><button data-action="settings"><i>⚙</i>设置</button></nav>`}
function game(){screen.innerHTML=`<div class="topbar"><button class="round" data-action="back" aria-label="返回小岛">‹</button><h2>点亮灯塔</h2><button class="round" data-action="rules" aria-label="玩法说明">?</button></div><div class="goal"><div class="goalhead"><span>🪵 木材 <b id="li-wood">${s.wood}</b>/20</span><span>⚑</span></div><div class="track" role="progressbar" aria-label="木材收集进度" aria-valuemin="0" aria-valuemax="20" aria-valuenow="${Math.min(s.wood,20)}"><div class="fill" style="width:${Math.min(s.wood/20*100,100)}%"></div></div></div><div class="stats"><div>🪙 金币 <b id="li-coins">${s.coins}</b></div><div>🎟 剩余 <b id="li-left">${s.left}</b> 次</div></div><div class="wheelbox"><div class="pointer"></div><div class="wheel" style="transform:rotate(${s.angle}deg)">${types.map((t,i)=>`<div class="wlabel" style="transform:rotate(${i*45}deg) translateY(-32cqw) rotate(${-i*45}deg)">${icons[t]}<small>+${t==='wood'?values[i]+s.boost:values[i]}</small></div>`).join('')}</div><div class="hub">☀</div></div><div class="message" aria-live="polite">${s.double?'顺风已就绪 · 下次资源翻倍':'转动转盘，让好运靠岸'}</div><div class="bottomactions"><button class="primary" data-action="spin">转动转盘</button><button class="secondary" data-action="craft">改造转盘 · 4 金币</button><br><button class="plain" data-action="rules">每格概率相同 · 查看规则</button></div>`}
function update(msg){root.querySelector('#li-wood').textContent=s.wood;root.querySelector('#li-coins').textContent=s.coins;root.querySelector('#li-left').textContent=s.left;root.querySelector('.fill').style.width=Math.min(s.wood/20*100,100)+'%';root.querySelector('.track').setAttribute('aria-valuenow',Math.min(s.wood,20));root.querySelector('.message').textContent=msg}
function modal(html,closable=true){lastFocus=document.activeElement;overlay.hidden=false;overlay.className='veil';overlay.innerHTML=`<section class="sheet" role="dialog" aria-modal="true" aria-label="游戏面板"><div class="handle"></div>${html}${closable?'<button class="plain" data-action="close">返回游戏</button>':''}</section>`;screen.inert=true;overlay.querySelector('button,input')?.focus()}
function close(){overlay.hidden=true;overlay.innerHTML='';screen.inert=false;if(lastFocus?.isConnected)lastFocus.focus()}
function upgrades(){selection=0;modal(`<h2>选择一项升级</h2><p class="sub">让下一次转动更有惊喜。</p><div class="choices">${[['🧰','加固工具','木材格每次多产出 1 个木材'],['🌬️','顺风时刻','下一次木材或金币奖励翻倍'],['🎟️','备用机会','增加 2 次转动']].map((x,i)=>`<button class="choice" data-choice="${i}" aria-pressed="${i===0}"><span>${x[0]}</span><div><strong>${x[1]}</strong><small>${x[2]}</small></div></button>`).join('')}</div><button class="primary" data-action="confirm">确认升级</button><p class="foot">仅本局生效</p>`,false)}
function finish(){s.won=s.wood>=20;if(s.won)completed=true;modal(`<div class="resulticon">${s.won?'🌅':'⛵'}</div><h2>${s.won?'灯塔亮起来了！':'离灯塔亮起又近了一步'}</h2><p>${s.won?'海风港湾有了新的光。灯塔已加入收藏。':`这次获得 ${s.wood} 个木材，还差 ${20-s.wood} 个。试试早点升级木材格。`}</p><div class="stats"><div>🪵 ${s.wood} 木材</div><div>🎡 ${s.spins} 次转动</div></div><button class="primary" data-action="restart">再挑战一次</button><button class="plain" data-action="finishhome">回到小岛</button>`,false)}
function spin(){if(s.busy||s.left<=0)return;s.busy=true;s.left--;screen.querySelectorAll('button').forEach(b=>b.disabled=true);let random=new Uint32Array(1);crypto.getRandomValues(random);const index=random[0]>>>29;const target=(360-index*45)%360;s.angle+=360*5+((target-s.angle%360+360)%360);const wheel=root.querySelector('.wheel');const duration=(design.fast||matchMedia('(prefers-reduced-motion: reduce)').matches)?40:2800;wheel.style.transitionDuration=duration+'ms';wheel.style.transform=`rotate(${s.angle}deg)`;update('好运正在靠岸…');setTimeout(()=>{let t=types[index],v=values[index],msg='';s.spins++;if(t==='wood'||t==='coin'){if(t==='wood')v+=s.boost;if(s.double){v*=2;s.double=false}if(t==='wood')s.wood+=v;else s.coins+=v;msg=`${icons[t]} 获得 ${v} ${t==='wood'?'个木材':'枚金币'}`}else if(t==='weather'){s.double=true;msg='🌬️ 顺风来了！下次资源翻倍'}else{pendingUpgrade=true;msg='🎁 获得一次升级选择'}s.busy=false;screen.querySelectorAll('button').forEach(b=>b.disabled=false);update(msg);if(s.wood>=20)finish();else if(pendingUpgrade||s.spins%3===0){pendingUpgrade=false;upgrades()}else if(s.left===0)finish()},duration+50)}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.choice!==undefined){selection=Number(b.dataset.choice);overlay.querySelectorAll('[data-choice]').forEach(x=>x.setAttribute('aria-pressed',Number(x.dataset.choice)===selection));return}switch(b.dataset.action){case'home':case'back':home();break;case'start':if(s.won||s.left===0)reset();game();break;case'spin':spin();break;case'close':close();break;case'confirm':if(selection===0)s.boost++;if(selection===1)s.double=true;if(selection===2)s.left+=2;close();game();if(s.left===0)finish();break;case'craft':if(s.coins<4){modal('<h2>改造转盘</h2><p>花费 4 枚金币，永久增强本局所有木材格，每次多获得 1 个木材。</p><p>当前金币不足，先转动收集金币吧。</p>');}else modal('<h2>加固木材格</h2><p>消耗 4 枚金币，让本局所有木材格每次多产出 1 个木材。</p><button class="primary" data-action="buy">花费 4 金币</button>');break;case'buy':if(s.coins>=4){s.coins-=4;s.boost++;close();game();update('🧰 改造完成，所有木材格 +1')}break;case'rules':modal('<h2>让幸运成为你的策略</h2><p>用 12 次转动收集 20 个木材，即可点亮灯塔。8 个格子等概率，每格 12.5%。</p><p>🪵 木材用于完成目标<br>🪙 金币用于改造木材格<br>☁️ 天气让下次资源翻倍<br>🎁 宝箱提供一次升级选择</p><p>每转动 3 次也可升级一次。顺风效果不叠加，结算后局内升级重置。</p>');break;case'restart':close();reset();game();break;case'finishhome':close();home();break;case'collection':modal(`<h2>小岛收藏</h2><p>每一份幸运，都留下了痕迹。</p><div class="collection"><div class="collectitem"><span>🏡</span>海边小屋</div><div class="collectitem"><span>🌳</span>海风花园</div><div class="collectitem"><span>⚓</span>木质码头</div><div class="collectitem"><span>${completed?'🌅':'🔒'}</span>${completed?'海岸灯塔':'完成灯塔挑战解锁'}</div></div>`);break;case'settings':modal(`<h2>设置</h2><label>快速转动<input id="li-fast" type="checkbox" ${design.fast?'checked':''}></label><p>当前为交互原型，进度只在本次打开期间保留。</p>`);overlay.querySelector('#li-fast').onchange=e=>{design.fast=e.target.checked};break;}});
function reset(){s={wood:0,coins:0,left:12,boost:0,double:false,spins:0,busy:false,won:false,angle:0};pendingUpgrade=false}
root.addEventListener('keydown',e=>{if(overlay.hidden)return;if(e.key==='Escape'&&overlay.querySelector('[data-action=close]')){close();return}if(e.key==='Tab'){const els=[...overlay.querySelectorAll('button,input')],first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});home();if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>root.style.setProperty('--li-orange',design.accent)});tweak.addColorPicker(design,'accent',{label:'主要按钮颜色'});tweak.addToggle(design,'fast',{label:'快速转动'});}
})();
</script>
</div>
